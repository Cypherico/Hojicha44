name: Static repo checks

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static_checks:
    name: Spec/gate static checks (no KiCad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # full history: board_commit() and the release-currency gate
          # read git log -- <paths>; on a depth-1 checkout every path
          # "changes" at the tip commit and the manifest stamp fails
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: npm test
      - run: python3 pcb/make_release.py --check

  plate_gates:
    name: Plate geometry gates (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # full history: board_commit() and the release-currency gate
          # read git log -- <paths>; on a depth-1 checkout every path
          # "changes" at the tip commit and the manifest stamp fails
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # --check runs every build gate and writes nothing (outside the
      # W1/W2 footprint windows, which are vendored in-repo first)
      - run: python3 plate/gen_plate.py --check

  board_gates:
    name: PCB board gates (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # full history: board_commit() and the release-currency gate
          # read git log -- <paths>; on a depth-1 checkout every path
          # "changes" at the tip commit and the manifest stamp fails
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # run against the COMMITTED boards — same gates as `npm test`'s
      # W1 python probe, without needing KiCad
      - run: python3 pcb/generators/check_board.py
      - run: python3 pcb/generators/audit_silk.py

  case_gates:
    name: Case geometry gates (CadQuery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # full history: board_commit() and the release-currency gate
          # read git log -- <paths>; on a depth-1 checkout every path
          # "changes" at the tip commit and the manifest stamp fails
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      # pinned in case/requirements.txt; OCP wheels are big but cacheable
      - run: pip install -r case/requirements.txt
      # Build the current CAD separately from the recorded fabrication set.
      - run: echo "CASE_OUT=$RUNNER_TEMP/hojicha-case" >> "$GITHUB_ENV"
      - run: python3 case/gen_case.py
      # M6 (multi-model review): the ring cover was committed ungated —
      # its pad-press / single-solid / passage gates must run in CI too
      - run: python3 case/gen_cover.py
      - run: python3 case/probe_bores.py
      - name: Check recorded fabrication STEPs
        run: |
          python3 case/check_case_exports.py "$CASE_OUT"
          CASE_OUT="$GITHUB_WORKSPACE/case/out" python3 case/probe_bores.py
      # H-7 left/right mirror gate — was manual-only (MANUFACTURING);
      # the negative control (0.5mm Right translation) must still fail
      # whenever the gate is touched
      - run: python3 case/mirror_gate.py
      - name: Check component fit on recorded fabrication STEPs
        env:
          CASE_OUT: ${{ github.workspace }}/case/out
        run: |
          jst="$RUNNER_TEMP/jst-ph.step"
          curl --fail --location --retry 3 --output "$jst" \
            'https://gitlab.com/kicad/libraries/kicad-packages3D/-/raw/10.0.6/Connector_JST.3dshapes/JST_PH_S2B-PH-K_1x02_P2.00mm_Horizontal.step'
          printf '%s  %s\n' 5343f72b9fe095ba999c44c2d42c2045032162dd11066bd4d36865caf3d1fba2 "$jst" | sha256sum --check
          python3 case/check_component_fit.py "$jst" --switch-lead-mm 3.25
          stock_log="$RUNNER_TEMP/hojicha-stock-switch.log"
          status=0
          python3 case/check_component_fit.py "$jst" --switch-lead-mm 5.00 > "$stock_log" || status=$?
          cat "$stock_log"
          test "$status" -eq 1
          for half in Left Right; do
            test "$(grep -Ec "^$half switch pin [123]: 0\.[0-9]*[1-9][0-9]* mm³ tub overlap, 0\.000 mm clearance$" "$stock_log")" -eq 3
          done
